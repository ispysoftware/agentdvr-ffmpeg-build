name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_ver:
        description: 'FFmpeg version (e.g. 9.0.1)'
        required: false
        default: '9.0.1'
      arch:
        description: 'Target architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64
          - x86_64

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.variant }}
    # Both architectures build on the arm64 macos-latest runner; x86_64 is a
    # cross-compile inside build_macos.sh (TARGET_ARCH).
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Notarization runs only when the Apple signing secrets are configured.
      HAVE_APPLE_SECRETS: ${{ secrets.APPLE_CERT_P12 != '' && '1' || '' }}

    permissions:
      contents: write

    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        variant: [gpl, lgpl]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve FFmpeg version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "val=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "val=${{ inputs.ffmpeg_ver }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (${{ matrix.arch }}-${{ matrix.variant }})
        if: github.event_name == 'push' || inputs.arch == 'all' || inputs.arch == matrix.arch
        env:
          FFMPEG_VER: ${{ steps.ver.outputs.val }}
          TARGET_ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: bash ./build_macos.sh

      - name: Import signing certificate
        if: env.HAVE_APPLE_SECRETS == '1' && github.ref_type == 'tag'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm /tmp/cert.p12
          # Allow codesign to use the key without a UI prompt (headless runner)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain >/dev/null

      - name: Sign and notarize
        if: env.HAVE_APPLE_SECRETS == '1' && github.ref_type == 'tag'
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FFMPEG_VER: ${{ steps.ver.outputs.val }}
        # Non-interactive mode auto-detected (no tty): signs the freshly built
        # zip in out/ and produces out/ffmpeg<ver>-macos-<arch>-notarized.zip.
        run: ./notarize_macos.sh "${FFMPEG_VER}" "${{ matrix.arch }}"

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

      - name: Upload workflow artifact
        if: "github.event_name == 'workflow_dispatch' && (inputs.arch == 'all' || inputs.arch == matrix.arch)"
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}-${{ matrix.variant }}-${{ steps.ver.outputs.val }}
          path: out/*
          retention-days: 90
